server {
    listen 8081;
    listen [::]:8081;
    server_name 192.168.5.15;
    root /var/www/devops-hackathon-de003-daotruongson/src;
    index index.html;
    access_log /var/log/nginx/sondao.access.log;
    error_log /var/log/nginx/sondao.error.log;

    location / {
        allow all;
        try_files $uri $uri/ =404;
    }
} 